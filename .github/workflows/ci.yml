name: CI - Flask App

# Triggered on a push to main AND when a Pull Request targeting main is opened/updated
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # needed to push to GitHub Container Registry (ghcr.io)

jobs:
  # Job 1: unit tests (runs in parallel with the Docker build)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the unit tests
        run: pytest -v

      # Email notification, only when a previous step (the tests) failed
      - name: Send an email if the tests fail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Tests failed in ${{ github.repository }} (${{ github.ref_name }})"
          body: |
            The unit tests failed for commit ${{ github.sha }} pushed by ${{ github.actor }}.
            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Job 2: Docker build (runs in parallel with the tests, no "needs")
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t flaskapp:${{ github.sha }} .

  # Job 3: push to two registries, only if BOTH previous jobs succeeded
  push:
    needs: [test, build]
    # success(): only when the tests (and the build) passed
    # github.event_name == 'push': never publish images from a Pull Request
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flaskapp" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${{ secrets.DOCKER_USERNAME }}/flaskapp" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub (registry 1)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (registry 2)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image to both registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
